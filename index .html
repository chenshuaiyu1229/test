<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="UTF-8">

<title>班牌小组件</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:transparent;
  font-family:"Microsoft YaHei",PingFang SC,sans-serif;
  overflow:hidden;
  /* 页面整体居中基础 */
  width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;
}
#container{
  width:410px;height:240px;
  border-radius:12px;overflow:hidden;
  background:rgba(12,16,24,0.85);
  color:#f0f4f8;
  box-shadow:0 8px 24px rgba(0,0,0,0.35);
  position:relative;
}
/* 位置模式：居中（默认） */
#container.position-center{
  position:relative;
}
/* 位置模式：右下角悬浮（原班牌模式，改CONFIG即可切换） */
#container.position-bottom-right{
  position:fixed;right:24px;bottom:24px;
}
#sliderWrap{width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;}
#slider{
  height:100%;display:flex;
  will-change:transform;
  transition:none;
}
/* 卡片内容统一垂直+水平居中 */
.slide{
  flex-shrink:0;width:410px;height:240px;padding:18px 24px;
  display:flex;flex-direction:column;justify-content:center;
}
.egg-slide{
  background:rgba(8,10,14,0.92);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;color:#b0b8c4;text-align:center;
}
.title{font-size:18px;margin-bottom:14px;color:#73b8ff;font-weight:500;text-align:center}
.curr-state{font-size:22px;margin-bottom:10px;font-weight:bold;text-align:center}
.lesson-item{font-size:20px;line-height:1.6;text-align:center}
.tag-active{color:#ff6b6b}
.tag-next{color:#4ade80}
.q-title{font-size:17px;margin-bottom:12px;line-height:1.4;text-align:center}
.op{
  padding:10px 12px;margin:6px 0;border-radius:8px;
  background:rgba(255,255,255,0.08);
  font-size:16px;
}
.op:active{background:rgba(255,255,255,0.25);}
.op.right{background:rgba(74,222,128,0.25);}
.op.wrong{background:rgba(255,107,107,0.25);}
.opt-cooling .op{opacity:0.5;pointer-events:none;}
.cooltip{font-size:14px;color:#aaa;margin-top:10px;text-align:center}
.power-dots{display:flex;gap:6px;margin-top:8px;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;background:#334155}
.dot.on{background:#38bdf8}
/* 天气内容全部居中 */
#weatherBox{text-align:center}
.weather-row{display:flex;justify-content:space-between;margin-top:12px;gap:8px}
.weather-day{text-align:center;flex:1}
.w-icon{font-size:26px;margin-bottom:4px}
.w-txt{font-size:14px;line-height:1.4}
</style>
</head>

function hm2min(str){let [h,m]=str.split(":").map(Number);return h*60+m;}
function getNowMin(){let d=new Date();return d.getHours()*60+d.getMinutes();}

function getDayAllLessons(dayOfWeek){
  let lessons = [];
  if(schedule.dayTable[dayOfWeek]?.length) lessons = lessons.concat(schedule.dayTable[dayOfWeek]);
  if(schedule.night[dayOfWeek]?.length) lessons = lessons.concat(schedule.night[dayOfWeek]);
  lessons.sort((a,b) => hm2min(a.s) - hm2min(b.s));
  return lessons;
}

function findNextLesson(fromDayOfWeek, fromTimeMin){
  for(let i=0; i<7; i++){
    const day = (fromDayOfWeek + i) % 7;
    const dayLessons = getDayAllLessons(day);
    if(dayLessons.length === 0) continue;
    if(i === 0){
      for(let j=0; j<dayLessons.length; j++){
        if(hm2min(dayLessons[j].s) > fromTimeMin){
          return { day, lesson: dayLessons[j], isToday: true };
        }
      }
    }else{
      return { day, lesson: dayLessons[0], isToday: false };
    }
  }
  return null;
}

function updateLesson(){
  const nowMin=getNowMin();
  const dw=new Date().getDay();
  const stEl=document.getElementById("lessonState");
  const infoEl=document.getElementById("lessonInfo");
  const todayLessons = getDayAllLessons(dw);
  let active = null;
  for(let i=0; i<todayLessons.length; i++){
    const it=todayLessons[i];
    const s=hm2min(it.s),e=hm2min(it.e);
    if(nowMin>=s && nowMin<=e){active=it;break;}
  }
  if(active){
    stEl.innerHTML='<span class="tag-active">🔴 正在上课</span>';
    infoEl.textContent=active.sub;
    return;
  }
  const nextInfo = findNextLesson(dw, nowMin);
  if(nextInfo){
    if(nextInfo.isToday){
      stEl.innerHTML='<span class="tag-next">🟢 即将上课</span>';
    }else{
      const dayName = schedule.dayNames[nextInfo.day];
      stEl.innerHTML=`<span class="tag-next">🟢 下一节（${dayName}）</span>`;
    }
    infoEl.textContent=nextInfo.lesson.sub;
  }else{
    stEl.textContent="暂无课程";
    infoEl.textContent="";
  }
}

// ========= 滑动手势 =========
const slider=document.getElementById("slider");
const slideCount=slider.children.length;
const mainCardMaxOffset = -(CONFIG.mainCardCount - 1) * CONFIG.slideWidth;
let currentIdx=0;
let isDragging=false;
let dragStartX=0;
let dragStartOffset=0;
let startTime=0;
let startX=0;

function getCurrentTranslateX(){
  const style = window.getComputedStyle(slider);
  const matrix = new DOMMatrix(style.transform);
  return matrix.m41;
}
function setOffset(x){slider.style.transform=`translateX(${x}px)`;}

function animateToIndex(idx){
  idx=Math.max(0,Math.min(slideCount-1,idx));
  currentIdx=idx;
  const target=-idx*CONFIG.slideWidth;
  slider.style.transition=`transform ${CONFIG.animDuration}ms ${CONFIG.animEasing}`;
  setOffset(target);
  slider.removeEventListener('transitionend', onTransitionEnd);
  slider.addEventListener('transitionend', onTransitionEnd, { once: true });
}
function onTransitionEnd(e){
  if(e.propertyName === 'transform'){
    slider.style.transition = 'none';
  }
}

slider.addEventListener("pointerdown",e=>{
  e.preventDefault();
  e.stopPropagation();
  isDragging=true;
  dragStartX=e.clientX;
  dragStartOffset = getCurrentTranslateX();
  startTime=performance.now();
  startX=e.clientX;
  slider.style.transition = 'none';
  slider.setPointerCapture(e.pointerId);
});

slider.addEventListener("pointermove",e=>{
  if(!isDragging) return;
  e.preventDefault();
  e.stopPropagation();
  const dx=e.clientX - dragStartX;
  let newX=dragStartOffset + dx;
  if(newX>0) newX = newX * CONFIG.boundaryDamping;
  if(newX < mainCardMaxOffset && dragStartOffset >= mainCardMaxOffset){
    const excess = newX - mainCardMaxOffset;
    newX = mainCardMaxOffset + excess * CONFIG.eggEnterDamping;
  }
  const maxLeft= -(slideCount-1)*CONFIG.slideWidth;
  if(newX < maxLeft) newX = maxLeft + (newX - maxLeft)*CONFIG.boundaryDamping;
  setOffset(newX);
});

slider.addEventListener("pointerup",e=>{
  if(!isDragging) return;
  isDragging=false;
  e.stopPropagation();
  const dx=e.clientX - startX;
  const dt=performance.now() - startTime;
  const vx=dx/dt;
  let predIdx=currentIdx;
  if(Math.abs(vx)>CONFIG.flickVelocity){
    predIdx=vx>0 ? currentIdx-1 : currentIdx+1;
  }else{
    const off= -currentIdx*CONFIG.slideWidth + dx;
    predIdx=Math.round(-off / CONFIG.slideWidth);
  }
  animateToIndex(predIdx);
  slider.releasePointerCapture(e.pointerId);
});

slider.addEventListener("pointercancel",()=>{
  if(isDragging){
    isDragging=false;
    animateToIndex(currentIdx);
  }
});

let power=3;
let coolEnd=0;
let curQ=null;
const qText=document.getElementById("qText");
const optWrap=document.getElementById("optWrap");
const coolTip=document.getElementById("coolTip");
const powerDots=document.getElementById("powerDots");
let coolTimer = null;

function renderDots(){
  powerDots.innerHTML="";
  for(let i=0;i<3;i++){
    const d=document.createElement("div");
    d.className="dot"+(i<power?" on":"");
    powerDots.appendChild(d);
  }
}
function pickQuestion(){
  curQ=questionBank[Math.floor(Math.random()*questionBank.length)];
  qText.textContent=curQ.q;
  optWrap.innerHTML="";
  curQ.opts.forEach((o,idx)=>{
    const div=document.createElement("div");
    div.className="op";
    div.dataset.idx=idx;
    div.textContent=o;
    optWrap.appendChild(div);
  })
}

optWrap.onclick=function(e){
  const el=e.target.closest(".op");
  if(!el) return;
  const selected=Number(el.dataset.idx);
  const now=Date.now();
  if(now<coolEnd||power<=0) return;
  power--;
  renderDots();
  if(selected===curQ.ans){
    qText.textContent="✅回答正确";
    el.classList.add("right");
  }else{
    qText.textContent="❌回答错误";
    el.classList.add("wrong");
  }
  if(power<=0){
    coolEnd=now + CONFIG.coolDuration;
    coolTip.textContent="已耗尽次数，冷却10分钟";
    optWrap.classList.add('opt-cooling');
  }
  setTimeout(pickQuestion,CONFIG.questionSwitchDelay);
}

function tickCool(){
  const now=Date.now();
  if(now < coolEnd){
    const remain=Math.ceil((coolEnd-now)/1000);
    const m=Math.floor(remain/60);
    const s=remain%60;
    coolTip.textContent=`冷却剩余 ${m}分${s}秒`;
  }else{
    if(coolEnd > 0){
      coolEnd = 0;
      power = 3;
      renderDots();
      optWrap.classList.remove('opt-cooling');
      coolTip.textContent = "";
    }
  }
}
renderDots();
pickQuestion();
coolTimer = setInterval(tickCool,1000);

  71:'❄️',
  // wttr.in 图标码
  'Sunny':'☀️', 'Partly cloudy':'🌤️', 'Cloudy':'⛅', 'Overcast':'☁️',
  'Light rain':'🌧️', 'Moderate rain':'🌧️', 'Heavy rain':'🌧️', 'Patchy rain possible':'🌧️',
  'Light snow':'❄️', 'Moderate snow':'❄️', 'Heavy snow':'❄️'
};

// 带超时的fetch
function fetchWithTimeout(url, options = {}, timeout = 10000){
  return Promise.race([
    fetch(url, options),
    new Promise((_, reject) => 
      setTimeout(() => reject(new Error('请求超时')), timeout)
    )
  ]);
}

// 从本地缓存获取天气
function getWeatherCache(){
  try{
    const cache = localStorage.getItem(WEATHER_CACHE_KEY);
    if(!cache) return null;
    const data = JSON.parse(cache);
    // 缓存未过期
    if(Date.now() - data.timestamp < CONFIG.weather.cacheHours * 3600 * 1000){
      return data;
    }
    return null;
  }catch(e){ return null; }
}

// 保存天气到本地缓存
function saveWeatherCache(data){
  try{
    localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({
      timestamp: Date.now(),
      ...data
    }));
  }catch(e){}
}

// 渲染天气
function renderWeather(days){
  let html='<div class="weather-row">';
  days.forEach(day=>{
    html+=`
    <div class="weather-day">
      <div class="w-icon">${day.icon}</div>
      <div class="w-txt">${day.date}</div>
      <div class="w-txt">${day.tempMin}~${day.tempMax}°C</div>
      <div class="w-txt" style="color:#94a3b8;font-size:12px">${day.text}</div>
    </div>`;
  });
  html+="</div>";
  weatherBox.innerHTML=html;
}

// 接口1：和风天气（国内首选，需配置Key）
async function loadFromQWeather(){
  if(!CONFIG.weather.qweatherKey) throw new Error('未配置和风天气Key');
  const url = `https://devapi.qweather.com/v7/weather/3d?location=${CONFIG.weather.longitude.toFixed(2)},${CONFIG.weather.latitude.toFixed(2)}&key=${CONFIG.weather.qweatherKey}`;
  const res = await fetchWithTimeout(url, {}, CONFIG.weather.timeout);
  if(!res.ok) throw new Error('和风天气请求失败');
  const json = await res.json();
  if(json.code !== '200') throw new Error('和风天气返回错误');
  
  const days = json.daily.map(item=>({
    date: item.fxDate.slice(5),
    tempMin: item.tempMin,
    tempMax: item.tempMax,
    text: item.textDay,
    icon: weatherIcons[item.iconDay] || '🌤️'
  }));
  return days;
}

// 接口2：Open-Meteo（国外，无需Key）
async function loadFromOpenMeteo(){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.weather.latitude}&longitude=${CONFIG.weather.longitude}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia%2FShanghai`;
  const res = await fetchWithTimeout(url, {}, CONFIG.weather.timeout);
  if(!res.ok) throw new Error('Open-Meteo请求失败');
  const json = await res.json();
  const daily = json.daily;
  const days = [];
  for(let i=0;i<3;i++){
    const wCode = daily.weathercode[i];
    days.push({
      date: daily.time[i].slice(5),
      tempMin: Math.round(daily.temperature_2m_min[i]),
      tempMax: Math.round(daily.temperature_2m_max[i]),
      text: wCode <= 2 ? '晴' : wCode <= 3 ? '多云' : wCode <= 65 ? '小雨' : '未知',
      icon: weatherIcons[wCode] || '🌤️'
    });
  }
  return days;
}

// 接口3：wttr.in（国外备用，无需Key）
async function loadFromWttr(){
  const url = `https://wttr.in/${encodeURIComponent(CONFIG.weather.cityName)}?format=j1&lang=zh`;
  const res = await fetchWithTimeout(url, {}, CONFIG.weather.timeout);
  if(!res.ok) throw new Error('wttr.in请求失败');
  const json = await res.json();
  const days = [];
  for(let i=0;i<3;i++){
    const day = json.weather[i];
    const desc = day.hourly[4].weatherDesc[0].value;
    days.push({
      date: day.date.slice(5),
      tempMin: day.mintempC,
      tempMax: day.maxtempC,
      text: desc || '未知',
      icon: weatherIcons[desc] || '🌤️'
    });
  }
  return days;
}

// 主加载函数：依次尝试所有接口
async function loadWeather(){
  weatherLoadFailed = false;
  
  // 优先读缓存
  const cache = getWeatherCache();
  if(cache){
    renderWeather(cache.days);
    // 有缓存的情况下后台静默更新，不影响体验
    refreshWeatherInBackground();
    return;
  }

  weatherBox.textContent = "正在获取天气…";
  try{
    let days = null;
    // 按优先级尝试接口
    if(CONFIG.weather.qweatherKey){
      try{ days = await loadFromQWeather(); }
      catch(e){ console.warn('和风天气失败，尝试备用接口1'); }
    }
    if(!days){
      try{ days = await loadFromOpenMeteo(); }
      catch(e){ console.warn('Open-Meteo失败，尝试备用接口2'); }
    }
    if(!days){
      days = await loadFromWttr();
    }

    if(days){
      renderWeather(days);
      saveWeatherCache({ days });
      if(weatherRetryTimer){
        clearInterval(weatherRetryTimer);
        weatherRetryTimer = null;
      }
    }
  }catch(err){
    weatherLoadFailed = true;
    weatherBox.innerHTML = `<div style="color:#aaa;line-height:1.6">天气加载失败<br><span style="font-size:12px">请检查网络，30分钟后自动重试</span></div>`;
    if(!weatherRetryTimer){
      weatherRetryTimer = setInterval(loadWeather, CONFIG.weatherRetryInterval);
    }
  }
}

// 后台静默更新天气（有缓存时用）
async function refreshWeatherInBackground(){
  try{
    let days = null;
    if(CONFIG.weather.qweatherKey){
      try{ days = await loadFromQWeather(); }catch(e){}
    }
    if(!days){
      try{ days = await loadFromOpenMeteo(); }catch(e){}
    }
    if(!days){
      try{ days = await loadFromWttr(); }catch(e){}
    }
    if(days){
      renderWeather(days);
      saveWeatherCache({ days });
    }
  }catch(e){}
}

loadWeather();

// ========= 低功耗优化 =========
function handleVisibilityChange(){
  if(document.hidden){
    if(coolTimer){ clearInterval(coolTimer); coolTimer = null; }
    if(weatherRetryTimer){ clearInterval(weatherRetryTimer); weatherRetryTimer = null; }
  }else{
    updateLesson();
    tickCool();
    if(!coolTimer) coolTimer = setInterval(tickCool, 1000);
    if(weatherLoadFailed) loadWeather();
  }
}
document.addEventListener('visibilitychange', handleVisibilityChange);

});
